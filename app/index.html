<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<title>Scena</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ LIBRARY ============ -->
<section id="library" class="screen">
  <header class="lib-head">
    <div class="brand"><img src="icons/icon-192.png" alt=""><span>Scena</span></div>
    <div class="lib-actions">
      <button class="btn" data-act="import"><i data-ic="upload"></i>Import</button>
      <button class="btn dark" data-act="new"><i data-ic="plus"></i>New project</button>
    </div>
  </header>
  <div class="lib-tools">
    <div class="search"><i data-ic="search"></i><input id="lib-search" type="search" placeholder="Search projects"></div>
  </div>
  <div id="lib-grid" class="lib-grid"></div>
</section>

<!-- ============ WORKSPACE ============ -->
<section id="workspace" class="screen hidden">
  <header class="topbar">
    <div class="tb-left">
      <button class="ib" data-act="home" title="All projects"><i data-ic="back"></i></button>
      <button class="ib" data-act="toggle-side" title="Navigator"><i data-ic="sidebar"></i></button>
      <input id="doc-title" class="doc-title" spellcheck="false" aria-label="Title">
    </div>
    <div class="tb-center" id="tb-format">
      <button class="style-btn" id="style-btn" data-act="style-menu"><span id="style-label">Action</span><i data-ic="chev"></i></button>
      <button class="ib touch-only" data-act="tab" title="Next element (Tab)"><i data-ic="tab"></i></button>
      <span class="sep"></span>
      <button class="ib fmt" data-fmt="bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button class="ib fmt" data-fmt="italic" title="Italic (Ctrl+I)"><em class="serif-i">I</em></button>
      <button class="ib fmt" data-fmt="underline" title="Underline (Ctrl+U)"><u>U</u></button>
      <span class="sep"></span>
      <button class="ib" data-act="add-note" title="Add note (Ctrl+Alt+M)"><i data-ic="note"></i></button>
    </div>
    <div class="tb-right">
      <div class="seg" id="view-seg">
        <button data-view="text" class="on">Script</button>
        <button data-view="cards">Cards</button>
        <button data-view="title">Title &amp; notes</button>
      </div>
      <button class="ib" data-act="undo" title="Undo (Ctrl+Z)"><i data-ic="undo"></i></button>
      <button class="ib" data-act="redo" title="Redo (Ctrl+Y)"><i data-ic="redo"></i></button>
      <button class="ib" data-act="find" title="Find (Ctrl+F)"><i data-ic="search"></i></button>
      <button class="btn small" data-act="export-menu"><i data-ic="download"></i><span class="hide-sm">Export</span></button>
      <button class="ib" data-act="more-menu" title="More"><i data-ic="more"></i></button>
    </div>
  </header>

  <div class="work">
    <aside id="side" class="side">
      <div class="side-tabs" id="side-seg">
        <button data-side="scenes" class="on">Scenes</button>
        <button data-side="chars">Characters</button>
        <button data-side="notes">Notes</button>
      </div>
      <div id="side-scenes" class="side-list"></div>
      <div id="side-chars" class="side-list hidden"></div>
      <div id="side-notes" class="side-list hidden"></div>
    </aside>

    <main id="scroller" class="scroller">
      <div id="findbar" class="findbar hidden">
        <input id="find-q" placeholder="Find">
        <span id="find-count"></span>
        <button class="ib sm" data-act="find-prev" title="Previous"><i data-ic="up"></i></button>
        <button class="ib sm" data-act="find-next" title="Next"><i data-ic="down"></i></button>
        <input id="find-r" placeholder="Replace with">
        <button class="btn small" data-act="replace-one">Replace</button>
        <button class="btn small" data-act="replace-all">All</button>
        <button class="ib sm" data-act="find-close" title="Close"><i data-ic="x"></i></button>
      </div>
      <div id="sheet-wrap" class="sheet-wrap">
        <div id="sheet" class="sheet pages">
          <div id="pagebg" class="pagebg" aria-hidden="true"></div>
          <div id="notemarks" class="notemarks"></div>
          <div id="editor" class="editor" contenteditable="true" spellcheck="true" lang="el"></div>
        </div>
      </div>
      <div id="cards" class="cards hidden"></div>
      <div id="titleview" class="sheet-wrap tv hidden"></div>
    </main>
  </div>

  <footer class="statusbar">
    <span id="status"></span>
    <span class="sb-right">
      <span id="savestate"></span>
      <span class="zoom"><button data-act="zoom-out" title="Zoom out">−</button><span id="zoomv">100%</span><button data-act="zoom-in" title="Zoom in">+</button></span>
    </span>
  </footer>
  <ul id="ac" class="ac hidden"></ul>
</section>

<div id="pop" class="pop hidden"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>
<div id="update" class="update hidden"></div>
<input type="file" id="file-in" class="hidden" accept=".scena,.fountain,.txt,.fdx,.docx,.pdf">
<div id="print" class="print-root"></div>

<script src="store.js"></script>
<script src="layout.js"></script>
<script src="zip.js"></script>
<script src="formats.js"></script>
<script src="app.js"></script>
</body>
</html>
